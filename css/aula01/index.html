<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>


<style>
p{
    font-size: 200px;
}
#gato{
    color: yellowgreen;
}
#cachorro{
    color: maroon;
}
</style>
</head>
<body>
    
<!-- CSS inline é aquele qeu vai dentro da própria tag -->
<p style="color: rebeccapurple;font-size: 200px;">Pietro</p>
<p id="cachorro">Jack </p>
<p id="gato">Litten</p>
</body>
</html>
