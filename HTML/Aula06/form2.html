<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2 - Radio e Checkbox</title>
</head>

<body>
    <header>

    </header>
    <main>

    </main>
    <footer>
        <form action="">
            <label for="">Insira seu e-mail:</label>
            <input type="email" name="email" id="email" required="true" placeholder="exemplo@gmail.com">

            <br>
            <br>

            <label for="nome">Insira seu nome:</label>
            <input type="text" name="nome" id="nome" required="true" maxlength="100" placeholder="João da Silva">


            <br>

            <label for="color">Escolha uma cor</label>
            <input type="color" name="color" id="color">

            <br>

            <label for="">Avalie o atendimento</label>

            <br>

            <input type="radio" name="estrelas" id="" value="5">
            <label for="5estrelas">⭐⭐⭐⭐⭐</label>

            <br>

            <input type="radio" name="estrelas" id="" value="4">
            <label for="4estrelas">⭐⭐⭐⭐</label>

            <br>

            <input type="radio" name="estrelas" id="" value="3">
            <label for="3estrelas">⭐⭐⭐</label>

            <br>

            <input type="radio" name="estrelas" id="" value="2">
            <label for="2estrelas">⭐⭐</label>

            <br>

            <input type="radio" name="estrelas" id="" value="1">
            <label for="1estrelas">⭐</label>

            <br>

            <label for="comentario">Deixe um comentário:</label>

            <br>

            <textarea name="" id="comentario" placeholder="Seu comentário" cols="30" rows="10"></textarea>

            <br>

            <input type="submit" value="Enviar!">
        </form>
    </footer>
</body>

</html>
